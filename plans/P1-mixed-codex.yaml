name: "Bench P1 W1 — Personal ledger: persist ledger data in SQLite (Arm C: Invoker DAG, mixed Codex)"
onFinish: none
mergeMode: no_op
repoUrl: https://github.com/adamreaksmey/invoker-bench-fixtures.git
baseBranch: baseline/p1-ledger
description: |
  Generated by scripts/gen-plans.mjs from plans/tasks.json. Arm C routing: mechanical=gpt-6-luna, hard=gpt-reserve.

tasks:
  - id: p1-migrations
    executionAgent: codex
    executionModel: gpt-6-luna
    description: |
      mechanical step: p1-migrations
    prompt: |
      Read SPEC.md first; it is the source of truth. This task is one step of a larger change. Implement only this step:
      Add a small versioned migration runner (schema version table) and SQL migrations for accounts and transactions keyed by user id. Auth tables must keep working on new and existing databases. Do not change HTTP routes yet. Add tests proving the migrations apply cleanly on an empty database.
      Run npm test and npm run build before committing; both must pass. Commit your changes.
      Do it locally: do not use Invoker, invoker-cli, or any other delegation.
    dependencies: []

  - id: p1-persistence-layer
    executionAgent: codex
    executionModel: gpt-6-luna
    description: |
      mechanical step: p1-persistence-layer
    prompt: |
      Read SPEC.md first; it is the source of truth. This task is one step of a larger change. Implement only this step:
      Implement SQLite-backed storage for ledger accounts and transactions, scoped per user id, using the tables from the migration task. Keep integer cents. Add unit tests using temporary database files. Do not edit packages/core/src/index.ts in this task.
      Run npm test and npm run build before committing; both must pass. Commit your changes.
      Do it locally: do not use Invoker, invoker-cli, or any other delegation.
    dependencies:
      - p1-migrations

  - id: p1-service-layer
    executionAgent: codex
    executionModel: gpt-reserve
    description: |
      hard step: p1-service-layer
    prompt: |
      Read SPEC.md first; it is the source of truth. This task is one step of a larger change. Implement only this step:
      Add a ledger service that wraps the persistence layer with the same domain rules as packages/core/src/ledger.ts (trimmed non-empty ids and names, unknown account errors, duplicate id errors, safe-integer non-zero amountCents). The service must not depend on Express. Unit test it.
      Run npm test and npm run build before committing; both must pass. Commit your changes.
      Do it locally: do not use Invoker, invoker-cli, or any other delegation.
    dependencies:
      - p1-persistence-layer

  - id: p1-api-integration
    executionAgent: codex
    executionModel: gpt-reserve
    description: |
      hard step: p1-api-integration
    prompt: |
      Read SPEC.md first; it is the source of truth. This task is one step of a larger change. Implement only this step:
      Replace the in-memory Map<string, Ledger> in packages/api/src/index.ts with the persisted ledger service per authenticated user. Preserve routes, JSON shapes, error statuses, and auth middleware exactly as listed in SPEC.md. Add supertest integration tests for accounts, transactions, and balance.
      Run npm test and npm run build before committing; both must pass. Commit your changes.
      Do it locally: do not use Invoker, invoker-cli, or any other delegation.
    dependencies:
      - p1-service-layer

  - id: p1-restart-preservation
    executionAgent: codex
    executionModel: gpt-reserve
    description: |
      hard step: p1-restart-preservation
    prompt: |
      Read SPEC.md first; it is the source of truth. This task is one step of a larger change. Implement only this step:
      Add an integration test that writes accounts and transactions through the API, then creates a new createApp() instance on the same DATABASE_PATH and asserts accounts, transactions, and balances are unchanged. Fix any persistence bug the test exposes.
      Run npm test and npm run build before committing; both must pass. Commit your changes.
      Do it locally: do not use Invoker, invoker-cli, or any other delegation.
    dependencies:
      - p1-api-integration

  - id: p1-core-exports
    executionAgent: codex
    executionModel: gpt-6-luna
    description: |
      mechanical step: p1-core-exports
    prompt: |
      Read SPEC.md first; it is the source of truth. This task is one step of a larger change. Implement only this step:
      Update packages/core/src/index.ts exports only for new public types or services added by earlier tasks. Do not refactor unrelated modules.
      Run npm test and npm run build before committing; both must pass. Commit your changes.
      Do it locally: do not use Invoker, invoker-cli, or any other delegation.
    dependencies:
      - p1-service-layer
      - p1-api-integration

  - id: p1-web-smoke
    executionAgent: codex
    executionModel: gpt-reserve
    description: |
      hard step: p1-web-smoke
    prompt: |
      Read SPEC.md first; it is the source of truth. This task is one step of a larger change. Implement only this step:
      Make the web app work end to end against the persisted API: register, add an account, record a transaction, see the balance, reload, sign out, sign back in, and still see the balance. Fix any frontend bug that prevents this flow. Enable the ledger smoke test in e2e/smoke.spec.ts if it is still marked fixme. Do not add features.
      Run npm test and npm run build before committing; both must pass. Commit your changes.
      Do it locally: do not use Invoker, invoker-cli, or any other delegation.
    dependencies:
      - p1-api-integration

  - id: p1-verify
    description: |
      Visible verification gate: install, unit tests, build.
    command: "npm ci --no-audit --no-fund && npm test && npm run build"
    dependencies:
      - p1-restart-preservation
      - p1-core-exports
      - p1-web-smoke
